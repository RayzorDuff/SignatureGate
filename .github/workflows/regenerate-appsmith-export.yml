name: Regenerate Appsmith export

on:
  workflow_dispatch:
    inputs:
      appsmith_ref:
        description: Full 40-character reviewed production-bound SignatureGate-Appsmith commit SHA
        required: true
      production_descriptor_sha:
        description: Full 40-character reviewed production descriptor baseline commit SHA
        required: true

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SignatureGate
        uses: actions/checkout@v4

      - name: Check out SignatureGate-Appsmith
        uses: actions/checkout@v4
        with:
          repository: RayzorDuff/SignatureGate-Appsmith
          ref: ${{ inputs.appsmith_ref }}
          path: .appsmith-source

      - name: Check out production Appsmith descriptor baseline
        uses: actions/checkout@v4
        with:
          repository: RayzorDuff/SignatureGate-Appsmith
          ref: ${{ inputs.production_descriptor_sha }}
          path: .appsmith-production

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate monolithic Appsmith export
        env:
          APP_SOURCE_SHA: ${{ inputs.appsmith_ref }}
          APP_DESCRIPTOR_SHA: ${{ inputs.production_descriptor_sha }}
        run: |
          node scripts/prepare-appsmith-release-export.mjs \
            --source .appsmith-source \
            --production-source .appsmith-production \
            --source-sha "$APP_SOURCE_SHA" \
            --production-source-sha "$APP_DESCRIPTOR_SHA" \
            --output "appsmith/Rooted Psyche Membership Ops.json" \
            --provenance appsmith/EXPORT_PROVENANCE.json

      - name: Verify source and export preservation
        run: |
          node --check scripts/prepare-appsmith-release-export.mjs
          node scripts/test-appsmith-rebind-datasource.mjs
          node scripts/test-appsmith-export.mjs
          node scripts/test-prepare-appsmith-release-export.mjs
          python3 scripts/validate_release.py --assets

      - name: Validate generated export
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const f = "appsmith/Rooted Psyche Membership Ops.json";
          const x = JSON.parse(fs.readFileSync(f, "utf8"));
          if (x.artifactJsonType !== "APPLICATION") throw new Error("Unexpected artifactJsonType");
          if (!Array.isArray(x.pageList)) throw new Error("Missing pageList");
          if (!Array.isArray(x.actionList)) throw new Error("Missing actionList");
          console.log(JSON.stringify({pages:x.pageList.length, actions:x.actionList.length, datasources:x.datasourceList?.length ?? 0, actionCollections:x.actionCollectionList?.length ?? 0}, null, 2));
          NODE

      - name: Commit regenerated export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "appsmith/Rooted Psyche Membership Ops.json" appsmith/EXPORT_PROVENANCE.json
          if git diff --cached --quiet; then
            echo "Generated export is already current."
          else
            git commit -m "chore: regenerate Appsmith export"
            git push
          fi
